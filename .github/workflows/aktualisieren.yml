# Sozialindex Oberfranken: Daten abrufen, Index berechnen, Website veröffentlichen.
#
# Läuft
#   - monatlich am 6. um 4 Uhr (UTC),
#   - auf Knopfdruck: Reiter "Actions" → "Daten aktualisieren" → "Run workflow",
#   - automatisch, wenn die Konfiguration oder Importdateien geändert werden
#     (z. B. über den Datenassistenten).
#
# Einstellungen unter Settings → Secrets and variables → Actions:
#   Variable DEPLOY_ZIEL   "pages" (GitHub Pages), "ssh" (rsync) oder "ftp" (FTPS); leer = nur Daten committen
#   Für ssh:  Secrets SSH_HOST, SSH_USER, SSH_KEY (privater Schlüssel), SSH_ZIELPFAD
#   Für ftp:  Secrets FTP_HOST, FTP_USER, FTP_PASSWORT, FTP_ZIELPFAD
#   Für Zensus 2022 und Kommunale Bildungsdatenbank (kostenlose Registrierung):
#             Secrets GENESIS_ZENSUS_USER / _PASSWORD, GENESIS_BILDUNG_USER / _PASSWORD
#   Optional: Secrets GENESIS_BAYERN_USER / _PASSWORD, GENESIS_REGIO_USER / _PASSWORD

name: Daten aktualisieren

on:
  schedule:
    - cron: "0 4 6 * *"
  workflow_dispatch:
    inputs:
      modus:
        description: "Lücken mit Demodaten füllen (nur zum Testen)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "konfiguration/**"
      - "daten/import/**"
      - "web/**"
      - "etl/**"
      - ".github/workflows/**"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: aktualisieren
  cancel-in-progress: false

jobs:
  daten:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      abruf: ${{ steps.abruf.outcome }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: Daten abrufen
        id: abruf
        continue-on-error: true
        env:
          GENESIS_BAYERN_USER: ${{ secrets.GENESIS_BAYERN_USER }}
          GENESIS_BAYERN_PASSWORD: ${{ secrets.GENESIS_BAYERN_PASSWORD }}
          GENESIS_REGIO_USER: ${{ secrets.GENESIS_REGIO_USER }}
          GENESIS_REGIO_PASSWORD: ${{ secrets.GENESIS_REGIO_PASSWORD }}
          GENESIS_ZENSUS_USER: ${{ secrets.GENESIS_ZENSUS_USER }}
          GENESIS_ZENSUS_PASSWORD: ${{ secrets.GENESIS_ZENSUS_PASSWORD }}
          GENESIS_BILDUNG_USER: ${{ secrets.GENESIS_BILDUNG_USER }}
          GENESIS_BILDUNG_PASSWORD: ${{ secrets.GENESIS_BILDUNG_PASSWORD }}
        run: |
          if [ "${{ inputs.modus }}" = "true" ]; then
            python etl/abrufen.py --demo-auffuellen | tee abruf.log
          else
            python etl/abrufen.py | tee abruf.log
          fi

      - name: Index berechnen
        if: steps.abruf.outcome == 'success'
        run: python etl/index_berechnen.py | tee -a abruf.log

      - name: Zusammenfassung
        if: always()
        run: |
          {
            if [ "${{ steps.abruf.outcome }}" != "success" ]; then
              echo "> **Datenabruf fehlgeschlagen.** Veröffentlicht wird die bisherige Fassung der Karte. Die Ursache steht im Protokoll unten."
              echo
            fi
            echo "## Datenabruf"
            echo '```'
            cat abruf.log 2>/dev/null || echo "kein Protokoll"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Geänderte Daten speichern
        if: steps.abruf.outcome == 'success'
        run: |
          git config user.name "sozialindex-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data daten/rohdaten.csv daten/quellenprotokoll.json
          if git diff --cached --quiet; then
            echo "Keine Änderungen an den Daten."
            exit 0
          fi
          git commit -m "Daten aktualisiert $(date +%Y-%m-%d)"
          # Hat sich das Repository während des Laufs geändert (z. B. durch eine
          # Bearbeitung im Browser), erst den neuen Stand holen, dann speichern.
          for versuch in 1 2 3; do
            if git pull --rebase --autostash origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME"; then
              echo "Daten gespeichert."
              exit 0
            fi
            echo "Speichern fehlgeschlagen (Versuch $versuch), neuer Versuch in 10 Sekunden."
            sleep 10
          done
          echo "::error::Die Daten konnten nicht gespeichert werden."
          exit 1

      - name: Website als Artefakt bereitstellen
        uses: actions/upload-artifact@v7
        with:
          name: website
          path: web/
          include-hidden-files: true
          retention-days: 7

  pages:
    needs: daten
    if: vars.DEPLOY_ZIEL == 'pages'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v8
        with: { name: website, path: web }
      # Eindeutiger Name je Versuch, damit "Re-run jobs" nicht an einem
      # doppelten Artefakt "github-pages" scheitert.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web
          name: github-pages-${{ github.run_attempt }}
      - id: deploy
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

  ssh:
    needs: daten
    if: vars.DEPLOY_ZIEL == 'ssh'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with: { name: website, path: web }
      - name: Per rsync übertragen
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_ZIELPFAD: ${{ secrets.SSH_ZIELPFAD }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id && chmod 600 ~/.ssh/id
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
          rsync -az --delete -e "ssh -i ~/.ssh/id" web/ "$SSH_USER@$SSH_HOST:$SSH_ZIELPFAD/"

  ftp:
    needs: daten
    if: vars.DEPLOY_ZIEL == 'ftp'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with: { name: website, path: web }
      - name: Per FTPS übertragen
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORT: ${{ secrets.FTP_PASSWORT }}
          FTP_ZIELPFAD: ${{ secrets.FTP_ZIELPFAD }}
        run: |
          sudo apt-get -qq update && sudo apt-get -qq install -y lftp
          lftp -u "$FTP_USER","$FTP_PASSWORT" -e "set ftp:ssl-force true; set ssl:verify-certificate yes; mirror -R --delete --verbose web/ $FTP_ZIELPFAD; quit" "$FTP_HOST"

  # Meldet einen fehlgeschlagenen Datenabruf als Fehler (mit E-Mail von GitHub),
  # nachdem die bisherige Fassung der Karte trotzdem veröffentlicht wurde.
  melden:
    needs: [daten, pages, ssh, ftp]
    if: always() && needs.daten.outputs.abruf == 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Datenabruf fehlgeschlagen
        run: |
          echo "::error::Der Datenabruf ist fehlgeschlagen. Die bisherige Karte wurde veröffentlicht. Details im Schritt 'Daten abrufen' des Jobs 'daten'."
          exit 1
