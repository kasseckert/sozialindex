# Beispielkonfiguration für nginx (Pfade anpassen)
server {
    listen 443 ssl http2;
    server_name sozialindex.example.de;
    # ssl_certificate ...; ssl_certificate_key ...;

    root /opt/sozialindex-oberfranken/web;
    index index.html;

    types { application/geo+json geojson; }
    gzip on;
    gzip_types text/css application/javascript application/json application/geo+json;

    location ~* \.(js|css|woff2)$ { expires 30d; }
    location ~* \.(json|geojson)$ { expires 1h; }

    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy no-referrer;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https://api.github.com https://www.gis-idmz.nrw.de; font-src 'self'";
}
